<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8"/>
        <title> Listas I </title>
        <meta name = "author" content = "Paula">
        <meta name = "keywords" content = "HTML, listas, vehículos, bebida, café, agua, leche">
        <meta name = "description" content = "Tipos de listas y ejemplos">
    </head>
    <body>
        <ul>
            <h1> Lista desordenada </h1>
            <li> Café </li>
            <li> Agua </li>
            <li> Leche </li>
        </ul>
        <ol>
            <h1> Lista ordenada </h1>
            <li> Café </li>
            <li> Agua </li>
            <li> Leche </li>
        </ol>
        <ul>
            <h1> Lista mixta </h1>
            <li> Café </li>
            <ol>
                <li> Solo </li>
                <li> Con leche </li>
                <ol>
                    <li> Latte </li>
                    <li> Capuccino </li>
                </ol>
            </ol>
            <li> Agua </li>
            <li> Leche </li>
        </ul>
        <dl>
            <h1> Lista de definiciones </h1>
            <dt> Coche </dt>
            <dd> Vehículo de cuatro ruedas </dd>
            <dt> Moto </dt>
            <dd> Vehículo de dos ruedas </dd>
        </dl>
    </body>
</html>
